# sway kiosk session for the hub UI on the Razer Phone 2.
# Landscape (90 deg) + 2x scale on the 1440x2560 panel -> logical 1280x720.
output DSI-1 transform 90 scale 2
output DSI-1 bg #101013 solid_color
# The touchscreen reports panel-native (portrait) coordinates and sway does not rotate them with the output.
# Measured 2026-11-10 by tapping the four corners: screen x = touch y, screen y = 1 - touch x.
input type:touch calibration_matrix 0 1 0 -1 0 1

default_border none
focus_follows_mouse no
xwayland disable
seat * hide_cursor 1000

# Power key short press toggles the screen in the hub UI (logind ignores the short press; long press powers off).
bindsym --locked --no-repeat XF86PowerOff exec pkill -USR1 -x hub-ui

# Volume keys: PipeWire default sink in 5% steps (capped at 100%); hub-ui shows the overlay on SIGUSR2.
# (sh -c: a bare ';' would end the sway command; '&&' would skip the overlay when wpctl hits the 100% cap.)
# Not swapped: the hardware volume-up key raises the volume (user tried the swapped layout and preferred this,
# 2026-11-10). Volume-down is the PMIC RESIN key (DTB fix in dts/sdm845-razer-aura.dts).
bindsym --locked XF86AudioRaiseVolume exec sh -c 'wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+; pkill -USR2 -x hub-ui'
bindsym --locked XF86AudioLowerVolume exec sh -c 'wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-; pkill -USR2 -x hub-ui'

# The hub UI dims the backlight itself; sway must not blank the output.
for_window [app_id="hub-ui"] fullscreen enable
for_window [title="Razer Hub"] fullscreen enable

exec /usr/local/bin/hub-ui-run
