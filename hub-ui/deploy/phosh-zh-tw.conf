# /etc/systemd/system/phosh.service.d/10-razer-zh-tw.conf
# Traditional Chinese for the Phosh debug desktop only. The system default (/etc/default/locale) stays English
# so tools whose output the hub parses (nmcli, wpctl) are not localized.
[Service]
Environment=LANG=zh_TW.UTF-8
Environment=LANGUAGE=zh_TW:zh
Environment=LC_ALL=
