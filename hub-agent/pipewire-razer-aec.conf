# ~/.config/pipewire/pipewire.conf.d/60-razer-aec.conf
# Razer hub: PipeWire owns the DMIC (hw:0,1, routed by razer-mic-setup) and runs WebRTC echo cancellation, so the
# wake word still works while the phone's own speakers play music. Everything the hub plays (Music Assistant via
# sendspin, chimes) goes to razer_aec_sink (the echo reference, default sink) -> the speaker sink; the agent records
# from razer_aec_source (mic minus what the speakers played).
context.objects = [
    {   factory = adapter
        args = {
            factory.name      = api.alsa.pcm.source
            node.name         = "razer_dmic"
            node.description  = "Razer DMIC (raw)"
            media.class       = "Audio/Source"
            api.alsa.path     = "hw:0,1"
            audio.format      = "S16LE"
            audio.rate        = 48000
            audio.channels    = 1
            audio.position    = [ MONO ]
            api.alsa.period-size = 1024
            priority.session  = 100
        }
    }
]
context.modules = [
    {   name = libpipewire-module-echo-cancel
        args = {
            library.name  = aec/libspa-aec-webrtc
            monitor.mode  = false
            capture.props = {
                node.name      = "razer_aec_capture"
                target.object  = "razer_dmic"
                node.passive   = true
            }
            source.props = {
                node.name        = "razer_aec_source"
                node.description = "Razer mic (echo cancelled)"
                audio.position   = [ MONO ]
            }
            sink.props = {
                node.name        = "razer_aec_sink"
                node.description = "Razer speakers (with echo reference)"
                priority.session = 2000
            }
            playback.props = {
                node.name      = "razer_aec_playback"
                node.passive   = true
            }
            aec.args = {
                webrtc.high_pass_filter   = true
                webrtc.noise_suppression  = true
                webrtc.gain_control       = false
                webrtc.extended_filter    = true
                webrtc.delay_agnostic     = true
            }
        }
    }
]
